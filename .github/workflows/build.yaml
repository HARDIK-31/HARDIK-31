name: README build
on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Configure pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: HARDIK-31
        run: python today.py
      - name: Commit and push changes
        run: |-
          git add dark_mode.svg light_mode.svg cache/
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -m "Auto-update profile stats [skip ci]" -a || echo "No changes to commit"
          git push
